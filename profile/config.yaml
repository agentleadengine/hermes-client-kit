# Explicit per-platform lists prevent future updates from silently widening the
# managed tool surface.
web:
  search_backend: searxng
# Never reply with pairing codes or declines to an unknown contact.
unauthorized_dm_behavior: ignore
approvals:
  mode: manual
  denial_breaker_threshold: 3
  deny:
    - "git push --force*"
    - "*curl*|*sh*"
    - "dd if=* of=/dev/*"
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true
skills:
  write_approval: true
  guard_agent_created: true
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - browser
    - computer_use
    - delegation
    - kanban
    - cronjob
    - image_gen
    - tts
    - homeassistant
    - messaging
platform_toolsets:
  cli: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  telegram: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  photon: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  whatsapp: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  signal: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  slack: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  agentmail: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  cron: [clarify, file, memory, search, skills, todo, vision, web, no_mcp]
  discord: [no_mcp]
  whatsapp_cloud: [no_mcp]
  bluebubbles: [no_mcp]
  email: [no_mcp]
  homeassistant: [no_mcp]
  mattermost: [no_mcp]
  matrix: [no_mcp]
  dingtalk: [no_mcp]
  feishu: [no_mcp]
  wecom: [no_mcp]
  wecom_callback: [no_mcp]
  weixin: [no_mcp]
  qqbot: [no_mcp]
  yuanbao: [no_mcp]
  webhook: [no_mcp]
  api_server: [no_mcp]
  acp: [no_mcp]
